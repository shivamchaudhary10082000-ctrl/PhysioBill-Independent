name: Apply Patient search clear

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - .github/workflows/apply-patient-search-clear.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch Patients search field only
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = '<div className="mb-4 relative"><Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /><input value={search} onChange={(event) => setSearch(event.target.value)} className="h-11 w-full rounded-xl border bg-card pl-10 pr-4 text-sm" placeholder="Search by Patient name or record number..." /></div>'
          new = '<div className="mb-4 relative"><Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /><input value={search} onChange={(event) => setSearch(event.target.value)} className="h-11 w-full rounded-xl border bg-card pl-10 pr-10 text-sm" placeholder="Search by Patient name or record number..." />{search && <button type="button" aria-label="Clear search" onClick={() => setSearch(\'\')} className="absolute right-2 top-1/2 grid size-8 -translate-y-1/2 place-items-center rounded-lg text-muted-foreground hover:bg-secondary hover:text-foreground"><X size={16} /></button>}</div>'
          if old not in text:
              raise SystemExit('Expected Patients search markup not found; refusing broad edit.')
          if text.count(old) != 1:
              raise SystemExit('Patients search markup was not unique; refusing edit.')
          path.write_text(text.replace(old, new, 1))
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Remove temporary workflow and commit verified patch
        run: |
          rm .github/workflows/apply-patient-search-clear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/apply-patient-search-clear.yml
          git commit -m "Add clear search control to Patients directory"
          git push origin HEAD:futureweb-production-backend
