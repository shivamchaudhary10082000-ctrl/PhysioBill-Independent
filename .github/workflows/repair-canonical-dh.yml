name: Repair canonical D-H declarations

on:
  push:
    branches:
      - futureweb-dh-repair

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip canonical repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-dh-repair
          fetch-depth: 0

      - name: Insert canonical declarations
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "const demoAuthUser: AuthUser = {"
          assert marker in text

          block = r'''/* =========================================================
   CANONICAL DEMO / NORMALIZATION DECLARATIONS
   ========================================================= */

const demoPatients: Patient[] = [
  {
    id: 'patient-demo-001',
    physioId: DEMO_PHYSIO_ID,
    userId: undefined,
    patientNumber: 'PT-2026-000001',
    name: 'Aarav Sharma',
    phone: '+91 90000 00001',
    email: 'aarav@example.com',
    address: '',
    age: '32',
    condition: 'Knee rehabilitation',
    referringDoctor: '',
    referralDate: '',
    insuranceTpa: '',
    policyMemberId: '',
    notes: 'Demo patient record.',
  },
  {
    id: 'patient-demo-002',
    physioId: DEMO_PHYSIO_ID,
    userId: undefined,
    patientNumber: 'PT-2026-000002',
    name: 'Meera Patel',
    phone: '+91 90000 00002',
    email: 'meera@example.com',
    address: '',
    age: '45',
    condition: 'Low back pain',
    referringDoctor: '',
    referralDate: '',
    insuranceTpa: '',
    policyMemberId: '',
    notes: 'Demo patient record.',
  },
];

const demoVisits: Visit[] = [
  {
    id: 'visit-demo-001',
    physioId: DEMO_PHYSIO_ID,
    patientId: 'patient-demo-001',
    visitNumber: 'VIS-2026-000001',
    date: today,
    treatment: 'Knee rehabilitation',
    modalities: 'TENS',
    exercises: 'Quadriceps activation and ROM',
    duration: '60',
    notes: 'Progressive rehabilitation session.',
    authorization: 'Approved — 10 sessions',
  },
];

const demoInvoices: Invoice[] = [
  {
    id: 'invoice-demo-001',
    physioId: DEMO_PHYSIO_ID,
    patientId: 'patient-demo-001',
    number: 'PB-2026-000001',
    description: 'Physiotherapy treatment',
    sessions: '5 sessions',
    startDate: iso(-7),
    endDate: today,
    fee: 3000,
    additional: 0,
    additionalDescription: '',
    discount: 0,
    gstRate: 0,
    total: 3000,
    paid: 0,
    paymentMethod: 'Select payment method',
    finalized: true,
    status: 'Outstanding',
    createdAt: new Date().toISOString(),
    auditTrail: [],
  },
  {
    id: 'invoice-demo-002',
    physioId: DEMO_PHYSIO_ID,
    patientId: 'patient-demo-002',
    number: 'PB-2026-000002',
    description: 'Physiotherapy treatment',
    sessions: '3 sessions',
    startDate: iso(-14),
    endDate: iso(-8),
    fee: 1800,
    additional: 0,
    additionalDescription: '',
    discount: 0,
    gstRate: 0,
    total: 1800,
    paid: 1800,
    paymentMethod: 'UPI',
    finalized: true,
    status: 'Paid',
    createdAt: new Date(Date.now() - 86400000).toISOString(),
    auditTrail: [],
  },
];

const normalizePatients = (value: Patient[]): Patient[] =>
  Array.isArray(value)
    ? value.map((patient) => ({
        ...patient,
        id: String(patient.id ?? ''),
        patientNumber: String(patient.patientNumber ?? ''),
        name: String(patient.name ?? ''),
        phone: String(patient.phone ?? ''),
        email: String(patient.email ?? ''),
        address: String(patient.address ?? ''),
        age: String(patient.age ?? ''),
        condition: String(patient.condition ?? ''),
        referringDoctor: String(patient.referringDoctor ?? ''),
        referralDate: String(patient.referralDate ?? ''),
        insuranceTpa: String(patient.insuranceTpa ?? ''),
        policyMemberId: String(patient.policyMemberId ?? ''),
        notes: String(patient.notes ?? ''),
      }))
    : [];

const normalizeVisits = (value: Visit[]): Visit[] =>
  Array.isArray(value)
    ? value.map((visit) => ({
        ...visit,
        id: String(visit.id ?? ''),
        patientId: String(visit.patientId ?? ''),
        visitNumber: String(visit.visitNumber ?? ''),
        date: String(visit.date ?? ''),
        treatment: String(visit.treatment ?? ''),
        modalities: String(visit.modalities ?? ''),
        exercises: String(visit.exercises ?? ''),
        duration: String(visit.duration ?? ''),
        notes: String(visit.notes ?? ''),
        authorization: String(visit.authorization ?? ''),
      }))
    : [];

const normalizeInvoices = (value: Invoice[]): Invoice[] =>
  Array.isArray(value)
    ? value.map((invoice) => ({
        ...invoice,
        id: String(invoice.id ?? ''),
        patientId: String(invoice.patientId ?? ''),
        number: String(invoice.number ?? ''),
        description: String(invoice.description ?? ''),
        sessions: String(invoice.sessions ?? ''),
        startDate: String(invoice.startDate ?? ''),
        endDate: String(invoice.endDate ?? ''),
        fee: Number(invoice.fee) || 0,
        additional: Number(invoice.additional) || 0,
        additionalDescription: String(invoice.additionalDescription ?? ''),
        discount: Number(invoice.discount) || 0,
        gstRate: Number(invoice.gstRate) || 0,
        total: Number(invoice.total) || 0,
        paid: Number(invoice.paid) || 0,
        paymentMethod: String(invoice.paymentMethod ?? ''),
        finalized: Boolean(invoice.finalized),
        status: deriveInvoiceStatus(
          Number(invoice.total) || 0,
          Number(invoice.paid) || 0,
          Boolean(invoice.finalized),
        ),
        createdAt: String(invoice.createdAt ?? new Date().toISOString()),
        auditTrail: Array.isArray(invoice.auditTrail)
          ? invoice.auditTrail
          : [],
      }))
    : [];

const normalizeSettings = (value: Settings): Settings => ({
  ...defaultSettings,
  ...(value && typeof value === 'object' ? value : {}),
  practiceName: String(value?.practiceName ?? defaultSettings.practiceName),
  defaultPayment: String(value?.defaultPayment ?? defaultSettings.defaultPayment),
  footerNote: String(value?.footerNote ?? defaultSettings.footerNote),
  showGst: Boolean(value?.showGst),
  dateFormat: String(value?.dateFormat ?? defaultSettings.dateFormat),
});

type InvoiceEditableField =
  | 'description'
  | 'sessions'
  | 'startDate'
  | 'endDate'
  | 'fee'
  | 'additional'
  | 'additionalDescription'
  | 'discount'
  | 'gstRate'
  | 'total'
  | 'paymentMethod';

const invoiceEditableFields: InvoiceEditableField[] = [
  'description',
  'sessions',
  'startDate',
  'endDate',
  'fee',
  'additional',
  'additionalDescription',
  'discount',
  'gstRate',
  'total',
  'paymentMethod',
];

const getInvoiceChangedFields = (
  before: Invoice,
  after: Invoice,
): string[] =>
  invoiceEditableFields.filter(
    (field) => before[field] !== after[field],
  );

const hasInvoiceFinancialChanges = (
  before: Invoice,
  after: Invoice,
): boolean =>
  before.fee !== after.fee ||
  before.additional !== after.additional ||
  before.additionalDescription !== after.additionalDescription ||
  before.discount !== after.discount ||
  before.gstRate !== after.gstRate ||
  before.total !== after.total ||
  before.paid !== after.paid;

'''

          text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify canonical declarations
        shell: bash
        run: |
          grep -q "const demoPatients: Patient\[\]" src/App.tsx
          grep -q "const demoVisits: Visit\[\]" src/App.tsx
          grep -q "const demoInvoices: Invoice\[\]" src/App.tsx
          grep -q "const normalizePatients =" src/App.tsx
          grep -q "const normalizeVisits =" src/App.tsx
          grep -q "const normalizeInvoices =" src/App.tsx
          grep -q "const normalizeSettings =" src/App.tsx
          grep -q "const invoiceEditableFields:" src/App.tsx
          grep -q "const getInvoiceChangedFields =" src/App.tsx
          grep -q "const hasInvoiceFinancialChanges =" src/App.tsx

      - name: Typecheck
        run: |
          npm install
          npm run typecheck

      - name: Commit repair and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/repair-canonical-dh.yml
          git rm .github/workflows/repair-canonical-dh.yml
          git commit -m "Repair canonical D-H declarations [skip canonical repair]"
          git push origin HEAD:futureweb-dh-repair
