name: Apply directory ledger UX

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - .github/workflows/apply-directory-ledger-ux.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch App shell route and Patient directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx')
          t=p.read_text()
          imp="import { PatientFinancialLedgerPage } from '@/Components/PatientFinancialLedgerGateway';\n"
          if imp not in t:
              needle="} from '@/lib/visits';\n"
              if needle not in t: raise SystemExit('visits import anchor missing')
              t=t.replace(needle, needle+imp, 1)
          t=t.replace("  age: string;\n  condition: string;", "  age: string;\n  sex?: string;\n  clinicalCategory?: string;\n  condition: string;", 1)
          route="    if (normalized.startsWith('/financial-ledger')) return <PatientFinancialLedgerPage />;\n"
          invoice="    if (normalized.startsWith('/invoices') || normalized.startsWith('/invoice')) return <InvoiceWorkspace workspace={workspace} editingInvoice={editingInvoice} onOpen={(invoice) => setEditingInvoiceId(invoice.id)} onClose={() => setEditingInvoiceId(null)} />;\n"
          if route not in t:
              if invoice not in t: raise SystemExit('invoice route anchor missing')
              t=t.replace(invoice, route+invoice, 1)
          pattern=r"function PatientsPage\(\{ patients, visits, invoices, loading, onAdd, onEdit, onDelete \}: \{ patients: Patient\[\]; visits: Visit\[\]; invoices: Invoice\[\]; loading: boolean; onAdd: \(\) => void; onEdit: \(patient: Patient\) => void; onDelete: \(patient: Patient\) => Promise<void> \}\) \{.*?\n\}\n\nfunction VisitsPage"
          repl='''function PatientsPage({ patients, visits, invoices, loading, onAdd, onEdit, onDelete }: { patients: Patient[]; visits: Visit[]; invoices: Invoice[]; loading: boolean; onAdd: () => void; onEdit: (patient: Patient) => void; onDelete: (patient: Patient) => Promise<void> }) {
  const [search, setSearch] = useState('');
  const therapyStarts = new Map<string, string>();
  visits.forEach((visit) => { const current = therapyStarts.get(visit.patientId); if (!current || visit.date < current) therapyStarts.set(visit.patientId, visit.date); });
  const filtered = patients.filter((patient) => [patient.name, patient.patientNumber].join(' ').toLowerCase().includes(search.toLowerCase()));
  return <div><PageHeader eyebrow="Patient directory" title="Patients" description="Search by Patient name or record number. Therapy start is derived from the earliest persisted Visit." action={<Button onClick={onAdd}><Plus size={16} /> Add patient</Button>} /><div className="mb-4 relative"><Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /><input value={search} onChange={(event) => setSearch(event.target.value)} className="h-11 w-full rounded-xl border bg-card pl-10 pr-4 text-sm" placeholder="Search by Patient name or record number..." /></div>{loading ? <div className="rounded-2xl border bg-card p-6 text-sm font-semibold text-muted-foreground">Loading patients…</div> : <div className="overflow-hidden rounded-2xl border bg-card divide-y">{filtered.map((patient) => { const visitCount = visits.filter((visit) => visit.patientId === patient.id).length; const outstanding = invoices.filter((invoice) => invoice.patientId === patient.id).reduce((sum, invoice) => sum + Math.max(invoice.total - invoice.paid, 0), 0); const therapyStart = therapyStarts.get(patient.id); const clinical = [patient.condition, patient.clinicalCategory].filter(Boolean).join(' · '); return <div key={patient.id} className="grid gap-3 p-5 md:grid-cols-[1.5fr_1fr_auto] md:items-center"><div><p className="font-extrabold">{patient.name}</p><p className="mt-1 text-xs text-muted-foreground">{clinical || 'No condition/category recorded'}</p><p className="text-xs text-muted-foreground">{therapyStart ? `Therapy started: ${dateLabel(therapyStart)}` : 'Therapy not started · No visits yet'}</p><p className="text-xs text-muted-foreground">{patient.patientNumber}</p></div><div><p className="text-xs text-muted-foreground">{visitCount} visits</p><p className="font-bold">{money(outstanding)} <span className="text-xs font-normal text-muted-foreground">outstanding</span></p></div><div className="flex gap-1 md:justify-end"><Button variant="ghost" onClick={() => onEdit(patient)}><Pencil size={15} /> Edit</Button><Button variant="danger" onClick={() => void onDelete(patient)}><X size={15} /> Delete</Button></div></div>; })}{filtered.length === 0 && <div className="p-6 text-sm text-muted-foreground">No patients found.</div>}</div>}</div>;
}

function VisitsPage'''
          nt,n=re.subn(pattern,repl,t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'PatientsPage patch count {n}')
          p.write_text(nt)
          PY
      - name: Remove one-shot workflow from final tree
        run: git rm .github/workflows/apply-directory-ledger-ux.yml
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check exact final tree
        run: npm run typecheck
      - name: Build exact final tree
        run: npm run build
      - name: Commit verified UX repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/apply-directory-ledger-ux.yml
          git commit -m "Integrate ledger directory into workspace shell"
          git push origin HEAD:futureweb-production-backend
