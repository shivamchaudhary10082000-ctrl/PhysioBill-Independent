name: Admin Control Plane Verification

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - 'src/lib/admin-operations.ts'
      - 'src/pages/Admin*.tsx'
      - 'src/pages/route-boundary/AdminRoutes.tsx'
      - 'src/pages/PublicRouteBoundary.tsx'
      - 'supabase/migrations/20260921060438_admin_operations_control_plane_foundation.sql'
      - '.github/workflows/admin-control-plane-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/admin-operations.ts'
      - 'src/pages/Admin*.tsx'
      - 'src/pages/route-boundary/AdminRoutes.tsx'
      - 'src/pages/PublicRouteBoundary.tsx'
      - 'supabase/migrations/20260921060438_admin_operations_control_plane_foundation.sql'
      - '.github/workflows/admin-control-plane-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        env:
          VITE_SUPABASE_URL: https://nbsvrzypypmmuvlgdpln.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: admin-control-plane-build-placeholder
          CF_PAGES_BRANCH: futureweb-production-backend
        run: npm run build

      - name: Create bounded Admin fixture schema
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema auth;
          create schema private;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;

          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          create function auth.jwt() returns jsonb language sql stable as $$
            select jsonb_build_object(
              'sub', nullif(current_setting('request.jwt.claim.sub', true), ''),
              'aal', coalesce(nullif(current_setting('request.jwt.claim.aal', true), ''), 'aal1')
            );
          $$;
          create table auth.mfa_factors (
            id uuid primary key,
            user_id uuid not null references auth.users(id),
            factor_type text not null,
            status text not null,
            created_at timestamptz not null default now()
          );

          create table public.app_users (
            id uuid primary key references auth.users(id),
            role text not null check (role in ('physio', 'patient'))
          );
          create table public.account_legal_acknowledgements (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references public.app_users(id),
            account_role text not null,
            notice_version text not null,
            professional_standards_acknowledged boolean not null default false,
            acknowledged_at timestamptz not null default now()
          );
          create table public.physiotherapists (
            id uuid primary key,
            user_id uuid not null unique references public.app_users(id),
            public_physio_id text,
            created_at timestamptz not null default now()
          );
          create table public.physiotherapist_profiles (
            physio_id uuid primary key references public.physiotherapists(id),
            full_name text not null default '',
            qualification text not null default ''
          );
          create table public.physiotherapist_discovery_profiles (
            physio_id uuid primary key references public.physiotherapists(id),
            display_name text not null default '',
            is_discoverable boolean not null default false
          );
          create table public.physiotherapist_professional_verifications (
            physio_id uuid primary key references public.physiotherapists(id),
            verification_status text not null
          );
          create table public.platform_patients (
            id uuid primary key,
            user_id uuid not null unique references public.app_users(id),
            public_patient_id text not null unique,
            created_at timestamptz not null default now()
          );
          create table public.patient_appointment_requests (
            id uuid primary key,
            platform_patient_id uuid not null references public.platform_patients(id),
            physio_id uuid not null references public.physiotherapists(id),
            service_mode text not null,
            starts_at timestamptz not null,
            ends_at timestamptz not null,
            timezone_name text not null,
            status text not null,
            requested_at timestamptz not null,
            responded_at timestamptz,
            cancelled_at timestamptz,
            cancelled_by text,
            reschedules_request_id uuid
          );
          create table public.communication_events (
            id uuid primary key,
            recipient_persona text not null,
            event_type text not null,
            scheduled_for timestamptz not null,
            created_at timestamptz not null default now()
          );
          create table public.communication_delivery_transitions (
            id uuid primary key,
            communication_event_id uuid not null references public.communication_events(id),
            transition_sequence bigint generated always as identity unique,
            channel text not null,
            state text not null,
            outcome_class text not null default 'none',
            recorded_at timestamptz not null default now()
          );
          create table public.professional_verification_requests (
            id uuid primary key,
            request_status text not null
          );
          create table public.invoices (
            id uuid primary key,
            physio_id uuid not null references public.physiotherapists(id),
            invoice_number text not null,
            status text not null,
            finalized boolean not null default false,
            total numeric not null default 0,
            paid numeric not null default 0,
            created_at timestamptz not null default now()
          );
          create table public.invoice_issuance_snapshots (
            invoice_id uuid primary key references public.invoices(id),
            total numeric not null
          );
          create table public.professional_reimbursement_documents (
            invoice_id uuid primary key references public.invoices(id),
            invoice_total numeric not null
          );
          create table public.invoice_document_artifacts (
            id uuid primary key,
            invoice_id uuid not null references public.invoices(id),
            document_version integer not null,
            generation_status text not null,
            created_at timestamptz not null default now()
          );
          create table public.platform_admin_memberships (
            user_id uuid primary key references auth.users(id),
            capability text not null,
            admin_role text not null default 'reviewer' check (admin_role in ('owner', 'reviewer')),
            is_active boolean not null default true,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create function public.set_updated_at() returns trigger language plpgsql as $$
          begin
            new.updated_at := now();
            return new;
          end;
          $$;
          create function private.current_admin_aal() returns text language sql stable security invoker set search_path = '' as $$
            select coalesce(auth.jwt() ->> 'aal', 'aal1');
          $$;

          insert into auth.users (id) values
            ('10000000-0000-4000-8000-000000000001');
          insert into public.platform_admin_memberships (
            user_id, capability, admin_role, is_active
          ) values (
            '10000000-0000-4000-8000-000000000001',
            'verification_reviewer',
            'owner',
            true
          );
          SQL

      - name: Apply Admin control-plane migration
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260921060438_admin_operations_control_plane_foundation.sql

      - name: Verify capability, masking, audit and denial boundaries
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id) values
            ('10000000-0000-4000-8000-000000000002'),
            ('10000000-0000-4000-8000-000000000003'),
            ('10000000-0000-4000-8000-000000000004');
          insert into public.app_users (id, role) values
            ('10000000-0000-4000-8000-000000000001', 'physio'),
            ('10000000-0000-4000-8000-000000000002', 'physio'),
            ('10000000-0000-4000-8000-000000000003', 'physio'),
            ('10000000-0000-4000-8000-000000000004', 'patient');
          insert into public.account_legal_acknowledgements (
            user_id, account_role, notice_version, professional_standards_acknowledged
          ) values
            ('10000000-0000-4000-8000-000000000001', 'physio', '2026-09-14', true),
            ('10000000-0000-4000-8000-000000000004', 'patient', '2026-09-14', false);

          insert into public.physiotherapists (id, user_id, public_physio_id) values
            ('20000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', 'PHY-000000000001'),
            ('20000000-0000-4000-8000-000000000002', '10000000-0000-4000-8000-000000000002', 'PHY-000000000002'),
            ('20000000-0000-4000-8000-000000000003', '10000000-0000-4000-8000-000000000003', 'PHY-000000000003');
          insert into public.physiotherapist_profiles (physio_id, full_name, qualification) values
            ('20000000-0000-4000-8000-000000000001', 'Owner Physio', 'BPT'),
            ('20000000-0000-4000-8000-000000000002', 'Operations Physio', 'MPT'),
            ('20000000-0000-4000-8000-000000000003', 'Reviewer Physio', 'BPT');
          insert into public.physiotherapist_discovery_profiles (physio_id, display_name, is_discoverable) values
            ('20000000-0000-4000-8000-000000000001', 'Owner Physio', true),
            ('20000000-0000-4000-8000-000000000002', 'Operations Physio', true),
            ('20000000-0000-4000-8000-000000000003', 'Reviewer Physio', false);
          insert into public.physiotherapist_professional_verifications (physio_id, verification_status) values
            ('20000000-0000-4000-8000-000000000001', 'verified'),
            ('20000000-0000-4000-8000-000000000002', 'verified'),
            ('20000000-0000-4000-8000-000000000003', 'pending');
          insert into public.platform_patients (id, user_id, public_patient_id) values
            ('30000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000004', 'PAT-000000000001');
          insert into public.patient_appointment_requests (
            id, platform_patient_id, physio_id, service_mode, starts_at, ends_at,
            timezone_name, status, requested_at, responded_at
          ) values (
            '40000000-0000-4000-8000-000000000001',
            '30000000-0000-4000-8000-000000000001',
            '20000000-0000-4000-8000-000000000002',
            'home_visit', now() + interval '1 day', now() + interval '2 days',
            'Asia/Kolkata', 'accepted', now() - interval '1 day', now()
          );
          insert into public.communication_events (
            id, recipient_persona, event_type, scheduled_for
          ) values (
            '70000000-0000-4000-8000-000000000001',
            'patient', 'appointment_accepted', now() - interval '1 hour'
          );
          insert into public.communication_delivery_transitions (
            id, communication_event_id, channel, state, outcome_class
          ) values (
            '71000000-0000-4000-8000-000000000001',
            '70000000-0000-4000-8000-000000000001',
            'sms', 'delivered', 'none'
          );
          insert into public.invoices (
            id, physio_id, invoice_number, status, finalized, total, paid
          ) values (
            '50000000-0000-4000-8000-000000000001',
            '20000000-0000-4000-8000-000000000002',
            'INV-15X400', 'paid', true, 6000, 6000
          );
          insert into public.invoice_issuance_snapshots (invoice_id, total) values
            ('50000000-0000-4000-8000-000000000001', 6000);
          insert into public.professional_reimbursement_documents (invoice_id, invoice_total) values
            ('50000000-0000-4000-8000-000000000001', 6000);
          insert into public.invoice_document_artifacts (
            id, invoice_id, document_version, generation_status
          ) values (
            '60000000-0000-4000-8000-000000000001',
            '50000000-0000-4000-8000-000000000001',
            1, 'complete'
          );

          insert into public.platform_admin_capability_grants (user_id, capability, is_active, grant_reason) values
            ('10000000-0000-4000-8000-000000000002', 'operations_admin', true, 'Operations fixture authority'),
            ('10000000-0000-4000-8000-000000000003', 'verification_reviewer', true, 'Reviewer fixture authority');

          do $$
          begin
            if not exists (
              select 1
                from public.platform_admin_capability_grants
               where user_id = '10000000-0000-4000-8000-000000000001'
                 and capability = 'platform_owner'
                 and is_active
            ) then
              raise exception 'Existing active platform owner was not bootstrapped.';
            end if;
          end $$;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-4000-8000-000000000002', true);
          select set_config('request.jwt.claim.aal', 'aal1', true);
          do $$
          begin
            begin
              perform * from public.list_admin_appointment_operations(
                now() - interval '30 days', now() + interval '1 year', null, 50, 0
              );
              raise exception 'AAL1 session entered Admin booking operations.';
            exception when sqlstate '42501' then null;
            end;
          end $$;
          commit;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-4000-8000-000000000002', true);
          select set_config('request.jwt.claim.aal', 'aal2', true);

          do $$
          declare
            booking record;
            overview jsonb;
            communication_health jsonb;
            patient_operation record;
            support_case_id uuid;
          begin
            select * into booking
              from public.list_admin_appointment_operations(
                now() - interval '30 days', now() + interval '1 year', null, 50, 0
              )
              limit 1;
            if booking.public_patient_id <> 'PAT-000000000001'
               or booking.public_physio_id <> 'PHY-000000000002'
               or booking.request_status <> 'accepted' then
              raise exception 'Masked patient-to-therapist booking evidence is incorrect.';
            end if;

            overview := public.get_admin_operations_overview(current_date - 29, current_date);
            if overview #>> '{traffic,measurement_status}' <> 'external_configuration_required' then
              raise exception 'Traffic must fail honestly until external measurement is configured.';
            end if;

            communication_health := public.get_admin_communication_health(
              now() - interval '30 days', now() + interval '1 minute'
            );
            if (communication_health ->> 'delivered')::integer <> 1
               or communication_health ->> 'provider_configuration' <> 'external_configuration_required' then
              raise exception 'Communication health evidence is incorrect or overstates provider configuration.';
            end if;

            select * into patient_operation
              from public.list_admin_patient_operations(100, 0)
             where public_patient_id = 'PAT-000000000001';
            if patient_operation.appointment_requests_30d <> 1
               or patient_operation.accepted_appointments_30d <> 1 then
              raise exception 'Masked patient booking summary is incorrect.';
            end if;

            support_case_id := public.create_platform_admin_case(
              'complaint', 'medium', 'Fixture appointment complaint',
              '40000000-0000-4000-8000-000000000001',
              '20000000-0000-4000-8000-000000000002',
              '30000000-0000-4000-8000-000000000001',
              now() + interval '3 days'
            );
            perform public.transition_platform_admin_case(
              support_case_id, 'triaged', 'Reviewed fixture complaint evidence'
            );

            begin
              perform public.create_platform_admin_case(
                'privacy_deletion', 'high', 'Attempted privacy case without authority'
              );
              raise exception 'Operations Admin created a privacy-only case.';
            exception when sqlstate '42501' then null;
            end;
          end $$;
          commit;

          do $$
          begin
            if not exists (
              select 1 from public.platform_admin_audit_events
              where actor_user_id = '10000000-0000-4000-8000-000000000002'
                and action = 'list_appointment_operations'
            ) then
              raise exception 'Authorized Admin read did not create audit evidence.';
            end if;

            begin
              update public.platform_admin_audit_events set reason = 'tampered';
              raise exception 'Append-only Admin audit history was mutable.';
            exception when sqlstate '55000' then null;
            end;
          end $$;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-4000-8000-000000000004', true);
          select set_config('request.jwt.claim.aal', 'aal2', true);
          do $$
          begin
            begin
              perform * from public.list_admin_appointment_operations(
                now() - interval '30 days', now() + interval '1 year', null, 50, 0
              );
              raise exception 'Patient persona entered Admin booking operations.';
            exception when sqlstate '42501' then null;
            end;
          end $$;
          commit;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-4000-8000-000000000001', true);
          select set_config('request.jwt.claim.aal', 'aal2', true);
          do $$
          declare
            billing record;
            privacy_case_id uuid;
            legal_summary record;
          begin
            select * into billing
              from public.list_admin_billing_consistency(100, 0)
             where invoice_number = 'INV-15X400';
            if billing.invoice_total <> 6000
               or billing.paid_total <> 6000
               or billing.snapshot_total <> 6000
               or billing.reimbursement_total <> 6000
               or billing.pdf_generation_status <> 'complete'
               or billing.consistency_status <> 'consistent' then
              raise exception '15 sessions x Rs 400 did not remain Rs 6,000 across billing evidence.';
            end if;

            select * into legal_summary
              from public.list_admin_legal_acknowledgement_summary()
             where account_role = 'physio' and notice_version = '2026-09-14';
            if legal_summary.acknowledgement_count <> 1
               or legal_summary.professional_standards_count <> 1 then
              raise exception 'Aggregate legal acknowledgement evidence is incorrect.';
            end if;

            privacy_case_id := public.create_platform_admin_case(
              'privacy_access', 'high', 'Fixture privacy access request'
            );
            perform public.transition_platform_admin_case(
              privacy_case_id, 'triaged', 'Identity verification queued for review'
            );

            begin
              perform public.set_platform_admin_capability(
                '10000000-0000-4000-8000-000000000004',
                'support_agent', true, 'Attempted patient Admin grant'
              );
              raise exception 'Patient persona received an Admin capability.';
            exception when sqlstate '23514' then null;
            end;

            begin
              perform public.set_platform_admin_capability(
                '10000000-0000-4000-8000-000000000001',
                'platform_owner', false, 'Attempted final owner removal'
              );
              raise exception 'Final platform owner was deactivated.';
            exception when sqlstate '23514' then null;
            end;
          end $$;
          commit;

          do $$
          begin
            if not exists (
              select 1 from public.platform_admin_cases
               where category = 'complaint' and case_status = 'triaged'
            ) or not exists (
              select 1 from public.platform_admin_cases
               where category = 'privacy_access' and case_status = 'triaged'
            ) then
              raise exception 'Admin case creation or controlled transition evidence is missing.';
            end if;

            begin
              update public.platform_admin_case_events set reason = 'tampered';
              raise exception 'Append-only Admin case history was mutable.';
            exception when sqlstate '55000' then null;
            end;
          end $$;
          SQL

      - name: Verify browser privileges remain purpose-built
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if has_table_privilege('authenticated', 'public.platform_admin_capability_grants', 'SELECT')
               or has_table_privilege('authenticated', 'public.platform_admin_audit_events', 'SELECT')
               or has_table_privilege('authenticated', 'public.platform_admin_cases', 'SELECT')
               or has_table_privilege('authenticated', 'public.platform_admin_case_events', 'SELECT') then
              raise exception 'Authenticated browser role received direct Admin table access.';
            end if;
            if has_function_privilege('anon', 'public.list_admin_appointment_operations(timestamptz,timestamptz,text,integer,integer)', 'EXECUTE') then
              raise exception 'Anonymous role can execute Admin booking operations.';
            end if;
          end $$;
          SQL
