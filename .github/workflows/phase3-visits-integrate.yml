name: Phase 3 Visits Verification

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - src/App.tsx
      - src/lib/visits.ts
      - supabase/migrations/202608210004_visits_clinical_records_authority.sql
      - .github/workflows/phase3-visits-integrate.yml

permissions:
  contents: read

concurrency:
  group: phase3-visits-futureweb-production-backend
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
