name: Phase 4 Invoices Verification

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - src/main.tsx
      - src/Components/InvoiceGateway.tsx
      - src/lib/invoices.ts
      - supabase/migrations/202608210006_invoice_authority.sql
      - .github/workflows/phase4-invoices-verify.yml

permissions:
  contents: read

concurrency:
  group: phase4-invoices-futureweb-production-backend
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
