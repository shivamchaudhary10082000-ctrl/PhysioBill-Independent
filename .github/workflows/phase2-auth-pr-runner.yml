name: Phase 2 auth App integration

on:
  pull_request:
    branches:
      - futureweb-production-backend
    paths:
      - .github/phase2-auth-pr-trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production backend branch
        uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic App.tsx auth integration
        run: python3 scripts/phase2-auth-integrate.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck production auth slice
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log
          if grep -E "src/(App\.tsx|pages/AuthPage\.tsx|hooks/use-auth-session\.ts|lib/(auth|supabase|workspace|production-workspace)\.ts)" /tmp/typecheck.log; then
            echo "Production auth/workspace TypeScript errors detected."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Full repository typecheck still has pre-existing errors outside the production auth slice; continuing to production build."
          fi
      - name: Build
        run: npm run build
      - name: Commit verified App.tsx integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Supabase auth workspace into App.tsx"
          git push origin HEAD:futureweb-production-backend
