name: Slice 5 Finalize

on:
  push:
    branches:
      - futureweb-production-backend
    paths:
      - .github/workflows/slice5-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: futureweb-production-backend
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore Patient Directory clear search control
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''<div className="mb-4 relative"><Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /><input value={search} onChange={(event) => setSearch(event.target.value)} className="h-11 w-full rounded-xl border bg-card pl-10 pr-4 text-sm" placeholder="Search by Patient name or record number..." /></div>'''
          new = '''<div className="mb-4 relative"><Search size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" /><input value={search} onChange={(event) => setSearch(event.target.value)} className="h-11 w-full rounded-xl border bg-card pl-10 pr-10 text-sm" placeholder="Search by Patient name or record number..." />{search && <button type="button" aria-label="Clear patient search" onClick={() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground"><X size={16} /></button>}</div>'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Patient search seam count was {count}; refusing edit.')
          path.write_text(text.replace(old, new, 1))

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified Slice 5 completion
        run: |
          rm .github/workflows/slice5-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/slice5-finalize.yml
          git commit -m "Complete Slice 5 Patient Directory search clear"
          git push origin HEAD:futureweb-production-backend
